<!doctype html>
<html lang="en">
  <head>
    <title>Moonlit Lotus Pond</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="preload"
      href="music/Vietsub%20Last%20Night%20On%20Earth%20-%20Green%20Day%20Lyrics%20Video.mp3"
      as="audio"
      type="audio/mpeg"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      /* Layout: full-bleed WebGL pond with a floating title and bottom-center action. */
      :root {
        --bg: #050a1e;
        --ink: #eef0ff;
        --muted: #9aa3c7;
        --glass: rgba(14, 22, 56, 0.66);
        --line: rgba(150, 170, 255, 0.22);
        --gold: #f0c58a;
        --display: "Instrument Serif", Georgia, "Times New Roman", serif;
        --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        overflow: hidden;
      }
      #app {
        position: relative;
        height: 100vh;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      #app::after {
        content: "";
        position: absolute;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            180deg,
            rgba(3, 7, 24, 0.12),
            transparent 22%,
            transparent 72%,
            rgba(3, 7, 24, 0.24)
          ),
          radial-gradient(
            ellipse at 50% 44%,
            transparent 54%,
            rgba(4, 8, 24, 0.16) 100%
          );
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .scene-atmosphere {
        position: absolute;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .scene-atmosphere::before,
      .scene-atmosphere::after {
        content: "";
        position: absolute;
        width: 58vw;
        height: 24vw;
        min-width: 620px;
        min-height: 260px;
        border-radius: 50%;
        filter: blur(38px);
        opacity: 0.16;
        mix-blend-mode: screen;
      }
      .scene-atmosphere::before {
        top: -18%;
        left: -12%;
        background: linear-gradient(
          120deg,
          rgba(79, 190, 194, 0.5),
          transparent 58%
        );
        transform: rotate(-8deg);
        animation: atmosphere-left 16s ease-in-out infinite alternate;
      }
      .scene-atmosphere::after {
        right: -15%;
        bottom: 4%;
        background: linear-gradient(
          240deg,
          rgba(171, 137, 220, 0.46),
          transparent 62%
        );
        transform: rotate(8deg);
        animation: atmosphere-right 18s ease-in-out infinite alternate;
      }
      @keyframes atmosphere-left {
        to {
          transform: translate3d(12%, 8%, 0) rotate(3deg) scale(1.08);
          opacity: 0.24;
        }
      }
      @keyframes atmosphere-right {
        to {
          transform: translate3d(-10%, -7%, 0) rotate(-4deg) scale(1.12);
          opacity: 0.22;
        }
      }
      .scene-shimmer {
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 48%;
        width: 44%;
        height: 1px;
        opacity: 0.38;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(216, 235, 255, 0.7),
          transparent
        );
        transform: translateX(-50%);
        filter: blur(2px);
        animation: pond-shimmer 7s ease-in-out infinite;
      }
      @keyframes pond-shimmer {
        0%,
        100% {
          transform: translateX(-58%) scaleX(0.55);
          opacity: 0.12;
        }
        50% {
          transform: translateX(-42%) scaleX(1);
          opacity: 0.38;
        }
      }
      .ui {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
        padding-block: 14px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .ui::before {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(229, 200, 158, 0.15);
        border-radius: 20px;
        box-shadow: inset 0 0 0 1px rgba(188, 214, 255, 0.04);
        background:
          linear-gradient(135deg, rgba(244, 201, 146, 0.34), transparent 55%)
            top left / 42px 42px no-repeat,
          linear-gradient(225deg, rgba(144, 209, 218, 0.28), transparent 55%)
            top right / 42px 42px no-repeat,
          linear-gradient(45deg, rgba(144, 209, 218, 0.24), transparent 55%)
            bottom left / 42px 42px no-repeat,
          linear-gradient(315deg, rgba(244, 201, 146, 0.3), transparent 55%)
            bottom right / 42px 42px no-repeat;
        pointer-events: none;
      }
      .ui > * {
        pointer-events: auto;
      }
      .glass {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #8fb0ff;
        outline-offset: 2px;
      }
      .music-control {
        position: fixed;
        z-index: 21;
        bottom: max(20px, env(safe-area-inset-bottom, 0px));
        left: max(18px, env(safe-area-inset-left, 0px));
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid rgba(144, 209, 218, 0.34);
        border-radius: 999px;
        background: rgba(12, 20, 48, 0.86);
        color: var(--ink);
        box-shadow:
          0 12px 30px rgba(2, 7, 24, 0.28),
          inset 0 1px 0 rgba(207, 229, 245, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font: 500 12px var(--body);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }
      .music-control:hover:not(:disabled) {
        border-color: rgba(243, 203, 130, 0.72);
        background: rgba(18, 38, 67, 0.94);
        box-shadow:
          0 12px 30px rgba(2, 7, 24, 0.28),
          0 0 18px rgba(243, 203, 130, 0.14);
      }
      .music-control[aria-pressed="true"] {
        border-color: rgba(243, 203, 130, 0.96);
        background: rgba(49, 56, 74, 0.96);
        box-shadow:
          0 12px 30px rgba(2, 7, 24, 0.34),
          0 0 22px rgba(243, 203, 130, 0.28),
          inset 0 0 0 1px rgba(243, 203, 130, 0.2);
      }
      .music-control[aria-pressed="true"] .music-icon {
        animation: music-note-pulse 900ms ease-in-out infinite alternate;
      }
      @keyframes music-note-pulse {
        from { transform: scale(1); text-shadow: 0 0 2px rgba(243, 203, 130, 0.4); }
        to { transform: scale(1.22); text-shadow: 0 0 12px rgba(243, 203, 130, 0.95); }
      }
      .music-control:disabled {
        cursor: default;
        opacity: 0.72;
      }
      .music-icon {
        color: var(--gold);
        font: 400 16px/1 var(--display);
      }
      @media (max-width: 700px) {
        .music-control {
          top: max(120px, calc(env(safe-area-inset-top, 0px) + 104px));
          right: max(16px, env(safe-area-inset-right, 0px));
          bottom: auto;
          left: auto;
          width: auto;
          min-width: 42px;
          height: 42px;
          justify-content: center;
          padding: 0 12px;
        }
        .music-control #musicLabel {
          position: static;
          width: auto;
          height: auto;
          overflow: visible;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
      }

      .title-card {
        position: absolute;
        top: 14px;
        left: max(16px, env(safe-area-inset-left, 0px));
        padding: 14px 18px 15px;
        max-width: min(340px, 60%);
        border-color: rgba(241, 161, 185, 0.3);
        background: linear-gradient(
          135deg,
          rgba(41, 28, 62, 0.64),
          rgba(12, 24, 54, 0.58)
        );
        box-shadow:
          0 16px 38px rgba(2, 7, 24, 0.16),
          0 0 28px rgba(226, 95, 133, 0.12),
          inset 0 1px 0 rgba(255, 226, 236, 0.11);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: title-enter 900ms 180ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes title-enter {
        from {
          opacity: 0;
          transform: translate3d(-18px, -8px, 0);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
          filter: blur(0);
        }
      }
      .title-card::before {
        content: "✧";
        position: absolute;
        top: 11px;
        right: 13px;
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid rgba(240, 197, 138, 0.42);
        border-radius: 50%;
        color: #f4d8a8;
        font: 400 17px/1 var(--display);
        box-shadow:
          inset 0 0 12px rgba(240, 197, 138, 0.09),
          0 0 16px rgba(240, 197, 138, 0.12);
        pointer-events: none;
      }
      .title-card::after {
        content: "";
        position: absolute;
        right: 16px;
        bottom: 0;
        left: 16px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 171, 196, 0.76),
          transparent
        );
        opacity: 0.46;
        animation: title-glint 5s ease-in-out infinite;
      }
      @keyframes title-glint {
        0%,
        100% {
          opacity: 0.32;
        }
        50% {
          opacity: 0.68;
        }
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f5a9bf;
        font-weight: 500;
      }
      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #f27c9c;
        box-shadow: 0 0 10px rgba(242, 124, 156, 0.72);
      }
      .title-card h1 {
        margin: 6px 0 4px;
        font: 400 23px/1.08 var(--display);
        text-wrap: balance;
      }
      .occasion {
        font: italic 400 13px var(--display);
        color: #c9c5df;
      }
      .memory-card {
        position: absolute;
        top: 14px;
        right: max(16px, env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 154px;
        padding: 10px 14px;
        border-color: rgba(144, 209, 218, 0.3);
        background: linear-gradient(
          135deg,
          rgba(13, 30, 55, 0.8),
          rgba(25, 27, 57, 0.74)
        );
        box-shadow:
          0 14px 36px rgba(2, 7, 24, 0.2),
          0 0 24px rgba(86, 190, 197, 0.08);
        animation: title-enter 900ms 320ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .memory-copy {
        display: grid;
        gap: 3px;
      }
      .memory-label {
        color: #a9c7d7;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .memory-count {
        color: #f3e7d4;
        font: 400 18px/1 var(--display);
      }
      .memory-count span {
        color: #c4c9df;
        font: 400 12px var(--body);
      }
      @media (max-width: 640px) {
        .memory-card {
          display: none;
        }
      }
      .memory-seal {
        position: relative;
        display: grid;
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(226, 193, 142, 0.46);
        border-radius: 50%;
        color: #f1cf9b;
        font: 400 20px/1 var(--display);
        box-shadow:
          inset 0 0 12px rgba(226, 193, 142, 0.1),
          0 0 16px rgba(226, 193, 142, 0.1);
      }
      .memory-seal::before,
      .memory-seal::after {
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(226, 193, 142, 0.2);
        border-radius: 50%;
        content: "";
      }
      .memory-seal::after {
        inset: -4px;
        border-color: rgba(144, 209, 218, 0.2);
      }
      @media (min-width: 521px) and (max-width: 640px) {
        .memory-card {
          display: flex;
          min-width: 0;
          gap: 8px;
          padding: 7px 10px;
          border-radius: 999px;
        }
        .memory-seal {
          width: 24px;
          height: 24px;
          font-size: 15px;
        }
        .memory-seal::before {
          inset: 3px;
        }
        .memory-seal::after {
          inset: -3px;
        }
        .memory-copy {
          gap: 0;
        }
        .memory-label {
          display: none;
        }
        .memory-count {
          font-size: 14px;
          white-space: nowrap;
        }
        .memory-count span {
          font-size: 10px;
        }
      }

      .prompt {
        box-sizing: border-box;
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: min(
          420px,
          calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px)))
        );
        padding: 9px;
        border-color: rgba(245, 163, 187, 0.34);
        border-radius: 22px;
        background: linear-gradient(
          135deg,
          rgba(35, 25, 66, 0.91),
          rgba(41, 24, 61, 0.86)
        );
        box-shadow:
          0 18px 44px rgba(2, 7, 24, 0.24),
          0 0 28px rgba(226, 95, 133, 0.14),
          inset 0 1px 0 rgba(255, 226, 236, 0.1);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: prompt-enter 900ms 620ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .prompt::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 82px;
        height: 1px;
        transform: translateX(-50%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 220, 164, 0.9),
          transparent
        );
        box-shadow: 0 0 10px rgba(255, 220, 164, 0.4);
        pointer-events: none;
      }
      .prompt-kicker {
        margin: 0 0 8px;
        color: #f2c6d1;
        font: italic 400 15px/1.1 var(--display);
        text-align: center;
      }
      @keyframes prompt-enter {
        from {
          opacity: 0;
          transform: translate(-50%, 24px) scale(0.96);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
          filter: blur(0);
        }
      }
      .prompt-row {
        display: flex;
        align-items: center;
        padding: 0;
      }
      .prompt-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 9px 4px 1px;
        color: #bdc5df;
        font-size: 10px;
        letter-spacing: 0.025em;
        text-align: center;
      }
      .hint-dot {
        width: 5px;
        height: 5px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #8ed3d7;
        box-shadow: 0 0 9px rgba(142, 211, 215, 0.66);
      }
      .grow {
        box-sizing: border-box;
        width: 100%;
        min-height: 48px;
        border: 1px solid rgba(255, 220, 229, 0.52);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 600;
        background: linear-gradient(
          180deg,
          #f08fa8 0%,
          #d86182 58%,
          #bd466d 100%
        );
        white-space: nowrap;
        transition:
          transform 180ms ease,
          filter 180ms ease,
          box-shadow 180ms ease;
        box-shadow: 0 8px 20px rgba(205, 73, 109, 0.24);
        animation: grow-breathe 3.8s ease-in-out infinite;
      }
      @keyframes grow-breathe {
        50% {
          box-shadow:
            0 8px 26px rgba(205, 73, 109, 0.34),
            0 0 22px rgba(255, 169, 193, 0.2);
        }
      }
      .grow:active {
        transform: scale(0.99);
      }
      @media (hover: hover) {
        .grow:hover {
          transform: translateY(-1px);
          filter: brightness(1.06);
          box-shadow: 0 8px 26px rgba(205, 73, 109, 0.38);
        }
      }
      .grow.grow-replay {
        animation: grow-replay 680ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes grow-replay {
        35% {
          transform: scale(0.96);
          filter: brightness(1.25);
          box-shadow: 0 0 28px rgba(255, 169, 193, 0.48);
        }
        70% {
          transform: scale(1.025);
        }
      }
      .photo-viewer {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            ellipse at 50% 56%,
            rgba(68, 153, 167, 0.16),
            transparent 58%
          ),
          radial-gradient(
            ellipse at 50% 39%,
            rgba(112, 99, 164, 0.2),
            transparent 52%
          ),
          rgba(3, 6, 18, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .photo-viewer.open {
        display: flex;
        animation: viewer-veil-in 480ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .photo-viewer.open .viewer-caption {
        animation: viewer-ui-in 540ms 180ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .photo-viewer.open .viewer-nav.prev {
        animation-name: viewer-ui-left;
      }
      .photo-viewer.open .viewer-nav.next {
        animation-name: viewer-ui-right;
      }
      .photo-viewer.open .viewer-close {
        animation: viewer-close-in 420ms 220ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .photo-viewer.open .viewer-nav {
        animation: viewer-nav-in 420ms 260ms both
          cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes viewer-close-in {
        from {
          opacity: 0;
          transform: translateY(-10px) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes viewer-nav-in {
        from {
          opacity: 0;
          transform: translateY(-50%) scale(0.82);
        }
        to {
          opacity: 1;
          transform: translateY(-50%) scale(1);
        }
      }
      @keyframes viewer-ui-in {
        from {
          opacity: 0;
          filter: blur(4px);
          transform: translate(-50%, 12px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate(-50%, 0);
        }
      }
      @keyframes viewer-ui-left {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(-18px);
        }
        to {
          opacity: 1;
          transform: translateY(-50%) translateX(0);
        }
      }
      @keyframes viewer-ui-right {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(18px);
        }
        to {
          opacity: 1;
          transform: translateY(-50%) translateX(0);
        }
      }
      .photo-viewer.closing {
        animation: viewer-veil-out 300ms cubic-bezier(0.4, 0, 1, 1) forwards;
        pointer-events: none;
      }
      @keyframes viewer-veil-in {
        from {
          opacity: 0;
          backdrop-filter: blur(4px);
        }
        to {
          opacity: 1;
          backdrop-filter: blur(18px);
        }
      }
      @keyframes viewer-veil-out {
        to {
          opacity: 0;
        }
      }
      .photo-stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
      }
      .photo-stage.dragging {
        cursor: grabbing;
      }
      .photo-stage.loading::after {
        content: "";
        position: absolute;
        z-index: 6;
        width: 34px;
        height: 34px;
        border: 2px solid rgba(180, 220, 230, 0.16);
        border-top-color: rgba(243, 203, 130, 0.94);
        border-radius: 50%;
        animation: viewer-spin 900ms linear infinite;
      }
      @keyframes viewer-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .photo-stage img {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        max-width: min(84vw, 1100px);
        max-height: min(56vh, 660px);
        width: auto;
        height: auto;
        opacity: 0;
        object-fit: contain;
        border-radius: 10px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72);
        user-select: none;
        -webkit-user-drag: none;
        transform: translate(-50%, -50%) translate(0px, 0px) scale(1);
        transform-origin: center center;
        transition:
          opacity 260ms ease,
          transform 160ms ease;
        pointer-events: none;
      }
      .photo-stage img.visible {
        opacity: 1;
      }
      .photo-stage img.viewer-enter-next {
        animation: viewer-photo-next 620ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .photo-stage img.viewer-enter-prev {
        animation: viewer-photo-prev 620ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .viewer-photo-matte.viewer-enter-next,
      .viewer-photo-frame.viewer-enter-next {
        animation-name: viewer-photo-next;
        animation-duration: 620ms;
        animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .viewer-photo-matte.viewer-enter-prev,
      .viewer-photo-frame.viewer-enter-prev {
        animation-name: viewer-photo-prev;
        animation-duration: 620ms;

  <body>
    <div id="app">

      id="backgroundMusic"
      autoplay

      preload="auto"
      loop
      src="music/Vietsub%20Last%20Night%20On%20Earth%20-%20Green%20Day%20Lyrics%20Video.mp3"
    ></audio>
    <input type="file" id="photoInput" accept="image/*" hidden />

      class="photo-viewer"
      id="photoViewer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="viewerTitle"

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      (function () {
        var app = document.getElementById("app"),
          backgroundMusic = document.getElementById("backgroundMusic"),
          musicToggle = document.getElementById("musicToggle"),
          musicFileInput = document.getElementById("musicFileInput"),
          musicLabel = document.getElementById("musicLabel"),
          musicErrorReported = false,
          musicNeedsFile = false,
          musicObjectUrl = null,
          musicDatabasePromise = null;
        backgroundMusic.muted = true;
        backgroundMusic.volume = 0.42;
        function openMusicDatabase() {
          if (!musicDatabasePromise) {
            musicDatabasePromise = new Promise(function (resolve, reject) {
              var request = window.indexedDB.open(
                "moonlit-lotus-pond-music",
                1,
              );
              request.onupgradeneeded = function () {
                request.result.createObjectStore("tracks");
              };
              request.onsuccess = function () {
                resolve(request.result);
              };
              request.onerror = function () {
                reject(
                  request.error || new Error("Could not open music storage."),
                );
              };
            });
          }
          return musicDatabasePromise;
        }
        function saveMusicFile(file) {
          return openMusicDatabase().then(function (database) {
            return new Promise(function (resolve, reject) {
              var transaction = database.transaction("tracks", "readwrite");
              transaction.objectStore("tracks").put(file, "background");
              transaction.oncomplete = resolve;
              transaction.onerror = function () {
                reject(
                  transaction.error ||
                    new Error("Could not save the selected music file."),
                );
              };
              transaction.onabort = function () {
                reject(
                  transaction.error ||
                    new Error("Saving the selected music file was aborted."),
                );
              };
            });
          });
        }
        function getSavedMusicFile() {
          return openMusicDatabase().then(function (database) {
            return new Promise(function (resolve, reject) {
              var request = database
                .transaction("tracks", "readonly")
                .objectStore("tracks")
                .get("background");
              request.onsuccess = function () {
                resolve(request.result || null);
              };
              request.onerror = function () {
                reject(
                  request.error ||
                    new Error("Could not read the saved music file."),
                );
              };
            });
          });
        }
        function setMusicFile(file) {
          if (musicObjectUrl) URL.revokeObjectURL(musicObjectUrl);
          musicObjectUrl = URL.createObjectURL(file);
          backgroundMusic.src = musicObjectUrl;
          backgroundMusic.load();
          musicErrorReported = false;
          musicNeedsFile = false;
          musicToggle.disabled = false;
          musicToggle.setAttribute("aria-label", "Play background music");
          musicToggle.setAttribute("aria-pressed", "false");
          musicLabel.textContent = "Play music";
        }
        function playMusic() {
          musicLabel.textContent = "Loading music…";
          backgroundMusic.play().catch(function (error) {
            if (error.name === "NotAllowedError") {
              musicLabel.textContent = "Tap anywhere for sound";
              return;
            }
            if (error.name === "AbortError")
              return;
            markMusicUnavailable(error);
          });
        }
        function markMusicUnavailable(error) {
          if (musicErrorReported) return;
          musicErrorReported = true;
          musicNeedsFile = true;
          musicToggle.setAttribute("aria-pressed", "false");
          musicToggle.setAttribute("aria-label", "Choose a local music file");
          musicLabel.textContent = "Choose music file";
          console.error("Unable to play the background music.", error);
        }
        backgroundMusic.addEventListener("play", function () {
          musicToggle.setAttribute("aria-pressed", "true");
          musicToggle.setAttribute(
            "aria-label",
            backgroundMusic.muted
              ? "Turn on background music"
              : "Pause background music",
          );
          musicLabel.textContent = backgroundMusic.muted
            ? "Tap for sound"
            : "Music playing · Pause";
        });
        backgroundMusic.addEventListener("pause", function () {
          musicToggle.setAttribute("aria-pressed", "false");
          musicToggle.setAttribute("aria-label", "Play background music");
          musicLabel.textContent = "Play music";
        });
        backgroundMusic.addEventListener("waiting", function () {
          if (!backgroundMusic.paused) musicLabel.textContent = "Loading music…";
        });
        backgroundMusic.addEventListener("playing", function () {
          musicLabel.textContent = backgroundMusic.muted
            ? "Tap for sound"
            : "Music playing · Pause";
        });
        backgroundMusic.addEventListener("error", function () {
          markMusicUnavailable(backgroundMusic.error);
        });
        musicToggle.addEventListener("click", function () {
          if (musicNeedsFile) {
            musicFileInput.click();
            return;
          }
          if (backgroundMusic.muted) {
            backgroundMusic.muted = false;
            musicToggle.setAttribute("aria-label", "Pause background music");
            if (backgroundMusic.paused) playMusic();
            else musicLabel.textContent = "Music playing · Pause";
            return;
          }
          if (backgroundMusic.paused) {
            playMusic();
          } else {
            backgroundMusic.pause();
          }
        });
        document.addEventListener(
          "pointerdown",
          function enableMusicOnFirstTouch(event) {
            if (event.target.closest("#musicToggle") || musicNeedsFile) return;
            backgroundMusic.muted = false;
            if (backgroundMusic.paused) playMusic();
            else musicLabel.textContent = "Music playing · Pause";
          },
          { once: true, capture: true },
        );
        musicFileInput.addEventListener("change", function () {
          var file = musicFileInput.files && musicFileInput.files[0];
          if (!file) return;
          setMusicFile(file);
          playMusic();
          saveMusicFile(file).catch(function (error) {
            console.error(
              "Could not remember the selected music file for future visits.",
              error,
            );
          });
        });
        // Start loading the bundled track right away; restoring IndexedDB first
        // can add noticeable startup latency on slower devices.
        musicNeedsFile = !backgroundMusic.currentSrc;
        if (!musicNeedsFile) playMusic();
        getSavedMusicFile()
          .then(function (file) {
            if (!file) return;
            var wasPlaying = !backgroundMusic.paused;
            setMusicFile(file);
            if (wasPlaying) playMusic();

            console.error(
              "Could not restore the saved background music.",
              error,
            );
          });
        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        var renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (e) {
          var m = document.createElement("div");
          m.className = "fallback";

            "This pond needs WebGL, which your browser has turned off.";
          app.insertBefore(m, app.firstChild);
          return;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        app.insertBefore(renderer.domElement, app.firstChild);

        /* ---------- pink lotus palette ---------- */
        var PALETTES = {
          pink: {
            base: 0xb64f64,
            tip: 0xf3b8ad,
            glow: 0xffc18c,
            fire: 0xe4ff80,
            bg: 0x050a1e,
          },
        };
        var current = "pink";

        /* ---------- helpers ---------- */
        function clamp(v, a, b) {
          return Math.max(a, Math.min(b, v));
        }
        function easeOut(t) {
          return 1 - Math.pow(1 - t, 3);
        }
        function easeInOut(t) {
          return t * t * (3 - 2 * t);
        }
        function seeded(seed) {
          var s = seed;
          return function () {
            s = (s * 16807) % 2147483647;
            return s / 2147483647;
          };
        }

        function glowTexture() {
          var c = document.createElement("canvas");
          c.width = c.height = 128;

          if (stagePointers.size < 2) lastPinchDistance = 0;
          if (!stagePointers.size) photoStage.classList.remove("dragging");
        });
        photoStage.addEventListener("pointercancel", function (event) {
          stagePointers.delete(event.pointerId);
          if (!stagePointers.size) photoStage.classList.remove("dragging");
        });
        document.addEventListener("keydown", function (event) {
          if (!viewer.classList.contains("open")) return;
          if (event.key === "Escape") closePhotoViewer();
          if (event.key === "ArrowLeft") navigatePhoto(-1);
          if (event.key === "ArrowRight") navigatePhoto(1);
        });
        viewer.addEventListener("click", function (event) {
          if (event.target === viewer) closePhotoViewer();
        });
        renderer.domElement.addEventListener("pointerdown", function (e) {
          down = { x: e.clientX, y: e.clientY, t: performance.now() };
        });
        renderer.domElement.addEventListener("pointerup", function (e) {
          if (!down) return;
          var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y),
            dt = performance.now() - down.t;
          down = null;
          if (moved >= 6 || dt >= 450 || e.button === 2) return;
          var i = pick(e);
          if (i < 0) return;
          if (FRAMES[i].customPhoto) openPhotoViewer(i);
          else choosePhoto(i);
        });
        renderer.domElement.addEventListener("contextmenu", function (e) {
          var i = pick(e);
          if (i < 0) return;
          e.preventDefault();
          choosePhoto(i);
        });
        renderer.domElement.addEventListener("pointermove", function (e) {
          if (e.buttons) return;
          hoveredFrame = pick(e);
          renderer.domElement.style.cursor =
            hoveredFrame >= 0 ? "pointer" : "grab";
        });
        renderer.domElement.addEventListener("pointerleave", function () {
          hoveredFrame = -1;
          renderer.domElement.style.cursor = "grab";
        });
        fileInput.addEventListener("change", function () {
          var file = fileInput.files && fileInput.files[0];
          if (!file || pendingFrame < 0) return;
          var idx = pendingFrame,
            reader = new FileReader();
          reader.onload = function () {
            var img = new Image();
            img.onload = function () {
              var frame = FRAMES[idx];
              drawPhotoOnFrame(frame, img, null, false);
              frame.photoUrl = frame.canvas.toDataURL("image/jpeg", 0.92);
            };
            img.onerror = function () {
              console.error(
                "Unable to decode the selected pond photo:",
                file.name,
              );
            };
            img.src = reader.result;
          };
          reader.onerror = function () {
            console.error(
              "Unable to read the selected pond photo:",
              reader.error,
            );
          };
          reader.readAsDataURL(file);
        });

        /* ---------- sizing + loop ---------- */
        function onResize() {
          var w = app.clientWidth,
            h = app.clientHeight;
          if (!w || !h) return;
          var pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
          if (renderer.getPixelRatio() !== pixelRatio)
            renderer.setPixelRatio(pixelRatio);
          var isLandscape = w > h,
            orientationChanged =
              lastViewportLandscape !== null &&
              lastViewportLandscape !== isLandscape;
          lastViewportLandscape = isLandscape;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          fireflies.material.uniforms.uScale.value =
            5 * renderer.getPixelRatio() * (h / 800);
          if (!touched) resetView();
          else if (orientationChanged)
            controls.maxDistance = Math.max(
              controls.maxDistance,
              fitDist(camera.aspect) * 1.7,
            );
        }
        if (window.ResizeObserver) new ResizeObserver(onResize).observe(app);
        else window.addEventListener("resize", onResize);

        var moonSkyDirection = new THREE.Vector3();
        var moonOverlayOffset = new THREE.Vector3();
        var padVeinPositions = padVeinGeometry.attributes.position;
        var padFineVeinPositions = padFineVeinGeometry.attributes.position;
        function updateSky(time) {
          var az = 0.34 + 0.06 * Math.sin(time * 0.011);
          var el = 0.1 + 0.02 * Math.sin(time * 0.007);
          moonSkyDirection.set(
            Math.sin(az) * Math.cos(el),
            Math.sin(el),
            -Math.cos(az) * Math.cos(el),
          );
          skyRoot.position.copy(camera.position);
          skyMat.uniforms.uTime.value = time;
          skyMat.uniforms.uMoon.value.copy(moonSkyDirection);
          skyMat.uniforms.uRot.value = time * 0.004;
          auroraLayers.forEach(function (material) {
            material.uniforms.uTime.value = time;
          });
          cloudMat.uniforms.uTime.value = time;
          cloudMat.uniforms.uMoon.value.copy(moonSkyDirection);
          reflMat.uniforms.uTime.value = time;
          moonPosition
            .copy(camera.position)
            .addScaledVector(moonSkyDirection, 240);

          var hx = moonSkyDirection.x,
            hz = moonSkyDirection.z,
            hl = Math.hypot(hx, hz) || 1;
          hx /= hl;
          hz /= hl;
          refl.position.x = camera.position.x + hx * 48;
          refl.position.z = camera.position.z + hz * 48;
          refl.rotation.y = Math.atan2(-hx, -hz);

          var ms = meteorState;
          if (ms.t0 < 0 && time > ms.next && !reduce) {
            camera.updateMatrixWorld();
            meteorRight.setFromMatrixColumn(camera.matrixWorld, 0);
            meteorUp.setFromMatrixColumn(camera.matrixWorld, 1);
            camera.getWorldDirection(meteorForward);
            ms.start
              .copy(camera.position)
              .addScaledVector(meteorForward, 220)
              .addScaledVector(meteorRight, (Math.random() - 0.5) * 220)
              .addScaledVector(meteorUp, 40 + Math.random() * 70);
            ms.ang = -(0.45 + Math.random() * 0.45);
            ms.dir
              .copy(meteorRight)
              .multiplyScalar(Math.cos(ms.ang))
              .addScaledVector(meteorUp, Math.sin(ms.ang));
            ms.t0 = time;
            meteor.visible = true;
          }
          if (ms.t0 >= 0) {
            var k = (time - ms.t0) / 0.8;
            if (k >= 1) {
              ms.t0 = -1;
              meteor.visible = false;
              ms.next = time + 10 + Math.random() * 9;
            } else {
              meteor.quaternion.copy(camera.quaternion);
              meteor.rotateZ(ms.ang);
              meteor.position.copy(ms.start).addScaledVector(ms.dir, k * 80);
              meteor.material.opacity = Math.sin(Math.PI * k);
            }
          }
        }
        function updateMoon(time) {
          starMaterial.uniforms.uMoonDirection.value.copy(moonSkyDirection);
          moonlight.position.copy(moonSkyDirection).multiplyScalar(14);
          moonMesh.position.copy(moonPosition);
          moonMesh.quaternion.copy(camera.quaternion);
          moonMesh.rotateZ(Math.sin((time * Math.PI * 2) / 110) * 0.018);

          moonGlowSprites[0].position.copy(moonPosition);
          wideMoonBloom.scale.setScalar(
            MOON_WIDTH *
              3.8 *
              (1.0 + 0.03 * Math.sin((time * Math.PI * 2) / 24)),
          );
          wideMoonBloom.material.opacity =
            0.025 + 0.003 * Math.sin((time * Math.PI * 2) / 24);
          var moonBreath = 0.82 + 0.02 * Math.sin((time * Math.PI * 2) / 28);
          moonMesh.material.opacity = moonBreath;

          water.material.uniforms.uMoonCamera.value.set(
            camera.position.x,
            camera.position.z,
          );
        }

        var last = performance.now(),
          time = 0,
          animationFrameId = null,
          lastFlowerUpdate = 0,
          lastPhotoSketchUpdate = 0;
        function tick(now) {
          animationFrameId = null;
          if (document.hidden) return;
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          time += reduce ? dt * 0.3 : dt;
          if (growing) {
            progress = Math.min(1, progress + dt / centerFlowerDuration);
            var zoomEase = easeInOut(progress);
            var zoomStrength = clamp(1.5 / camera.aspect, 1, 2.8);
            bloomZoomTarget = 1 + 0.72 * zoomStrength;
            camera.zoom = 1 + (bloomZoomTarget - 1) * zoomEase;
            camera.updateProjectionMatrix();
            if (progress >= 1) {
              growing = false;
              bloomZoomReleaseStart = now + 2200;
            }
          } else if (bloomZoomReleaseStart) {
            if (now < bloomZoomReleaseStart) {
              camera.zoom = bloomZoomTarget;
            } else {
              var zoomReleaseProgress = clamp(
                (now - bloomZoomReleaseStart) / 2000,
                0,
                1,
              );
              camera.zoom =
                1 +
                (bloomZoomTarget - 1) * (1 - easeInOut(zoomReleaseProgress));
              if (zoomReleaseProgress >= 1) {
                camera.zoom = 1;
                bloomZoomTarget = 1;
                bloomZoomReleaseStart = 0;
              }
            }
            camera.updateProjectionMatrix();
          }
          fireflies.material.uniforms.uTime.value = time;
          starMaterial.uniforms.uTime.value = time;
          starField.quaternion.setFromAxisAngle(
            skyRotationAxis,
            (time * Math.PI * 2) / 86400,
          );
          water.material.uniforms.uTime.value = time;
          var mobileLightBoost = clamp((0.9 - camera.aspect) / 0.45, 0, 1);
          var bloomLight = easeInOut(progress);
          var moonReflection =
            1.2 * bloomLight + 0.65 * mobileLightBoost;
          water.material.uniforms.uBloomLight.value = moonReflection;
          water.material.uniforms.uMobileFill.value =
            1.35 * mobileLightBoost + 0.25 * bloomLight;
          moonlight.intensity =
            1.1 + 0.65 * bloomLight + 0.8 * mobileLightBoost;
          fillLight.intensity =
            0.2 + 0.35 * bloomLight + 0.9 * mobileLightBoost;
          waterGlow.material.opacity =
            0.2 +
            0.03 * Math.sin(time * 0.9) +
            0.15 * bloomLight +
            0.22 * mobileLightBoost;
          heartLilyGroup.position.y =
            0.055 + (reduce ? 0 : Math.sin(time * 0.42) * 0.008);
          heartLilyGroup.rotation.z = reduce
            ? 0
            : Math.sin(time * 0.24) * 0.018;
          heartLilyOutline.material.opacity = reduce
            ? 0.09
            : 0.075 + 0.035 * (0.5 + 0.5 * Math.sin(time * 0.36));
          core.intensity =
            2.4 +
            0.3 * Math.sin(time * 0.9) +
            1.1 * bloomLight +
            0.9 * mobileLightBoost;
          for (
            var pondLightIndex = 0;
            pondLightIndex < pondLightPositions.length;
            pondLightIndex++
          ) {
            var pondLight = pondLightPositions[pondLightIndex];
            var pondPulse = reduce
              ? 0.62
              : 0.58 +
                0.42 *
                  (0.5 +
                    0.5 * Math.sin(time * pondLight.speed + pondLight.phase));
            var pondHover = reduce
              ? 0
              : Math.sin(time * 0.38 + pondLight.phase) * 0.012;
            pondLightTransform.position.set(
              pondLight.x,
              pondLight.y + pondHover,
              pondLight.z,
            );
            pondLightTransform.rotation.set(0, 0, 0);
            pondLightTransform.scale.setScalar(0.78 + pondPulse * 0.45);
            pondLightTransform.updateMatrix();
            pondLightCore.setMatrixAt(
              pondLightIndex,
              pondLightTransform.matrix,
            );
            pondLightTransform.position.set(pondLight.x, 0.038, pondLight.z);
            pondLightTransform.rotation.set(-Math.PI / 2, 0, 0);
            pondLightTransform.scale.setScalar(1.3 + pondPulse * 0.5);
            pondLightTransform.updateMatrix();
            pondLightHalo.setMatrixAt(
              pondLightIndex,
              pondLightTransform.matrix,
            );
            pondLightTransform.position.set(
              pondLight.x + pondLight.reflectionX,
              0.044,
              pondLight.z + 0.35,
            );
            pondLightTransform.rotation.set(-Math.PI / 2, 0, 0);
            pondLightTransform.scale.set(
              pondLight.reflectionWidth * (0.72 + pondPulse * 0.45),
              pondLight.reflectionLength * (0.72 + pondPulse * 0.5),
              1,
            );
            pondLightTransform.updateMatrix();
            pondLightReflection.setMatrixAt(
              pondLightIndex,
              pondLightTransform.matrix,
            );
          }
          pondLightCore.instanceMatrix.needsUpdate = true;
          pondLightHalo.instanceMatrix.needsUpdate = true;
          pondLightReflection.instanceMatrix.needsUpdate = true;
          pondLightLines.material.opacity = reduce
            ? 0.18
            : 0.2 + 0.08 * (0.5 + 0.5 * Math.sin(time * 0.34));
          pondConstellationLines.material.opacity = reduce
            ? 0.14
            : 0.14 + 0.12 * (0.5 + 0.5 * Math.sin(time * 0.26));
          pondConstellationLines.rotation.y = reduce
            ? 0
            : Math.sin(time * 0.035) * 0.018;
          for (
            var petalLightIndex = 0;
            petalLightIndex < pondPetalPositions.length;
            petalLightIndex++
          ) {
            var petalLight = pondPetalPositions[petalLightIndex];
            var petalPulse = reduce
              ? 0.7
              : 0.55 +
                0.45 *
                  (0.5 +
                    0.5 * Math.sin(time * petalLight.speed + petalLight.phase));
            var petalLift = reduce
              ? 0
              : Math.sin(time * 0.31 + petalLight.phase) * 0.018;
            pondLightTransform.position.set(
              petalLight.x,
              petalLight.y + petalLift,
              petalLight.z,
            );
            pondLightTransform.rotation.set(0, 0, 0);
            pondLightTransform.scale.setScalar(0.72 + petalPulse * 0.42);
            pondLightTransform.updateMatrix();
            pondPetalLightCore.setMatrixAt(
              petalLightIndex,
              pondLightTransform.matrix,
            );
            pondLightTransform.position.set(petalLight.x, 0.042, petalLight.z);
            pondLightTransform.rotation.set(-Math.PI / 2, 0, 0);
            pondLightTransform.scale.setScalar(0.82 + petalPulse * 0.38);
            pondLightTransform.updateMatrix();
            pondPetalLightHalo.setMatrixAt(
              petalLightIndex,
              pondLightTransform.matrix,
            );
          }
          pondPetalLightCore.instanceMatrix.needsUpdate = true;
          pondPetalLightHalo.instanceMatrix.needsUpdate = true;
          if (floatingPetalField) floatingPetalField.update(time);
          if (now - lastFlowerUpdate >= 1000 / 30) {
            for (
              var flowerIndex = 0;
              flowerIndex < flowers.length;
              flowerIndex++
            ) {
              flowers[flowerIndex].update(progress, time);
            }
            if (miniFlowerField)
              miniFlowerField.update((now - buildStarted) / 1000, time);
            if (pondAccentFlowerField) pondAccentFlowerField.update(time);
            lastFlowerUpdate = now;
          }
          for (
            var flowerIndex = 0;
            flowerIndex < flowers.length;
            flowerIndex++
          ) {
            var flowerPairIndex = Math.floor(flowerIndex / 2);
            var sway = reduce ? 0 : time * 0.55 + flowerPairIndex * 1.3;
            flowers[flowerIndex].group.rotation.z = reduce
              ? 0
              : Math.sin(sway) * 0.024;
            flowers[flowerIndex].group.rotation.x = reduce
              ? 0
              : Math.cos(sway * 0.8) * 0.016;
          }
          controls.autoRotateSpeed =
            growing && controls.autoRotate
              ? (flowerRevealAngularSpeed * 3600 * dt) / (2 * Math.PI)
              : baseAutoRotateSpeed;
          controls.update();
          var updateSketch = now - lastPhotoSketchUpdate >= 1000 / 30;
          updatePhotoFrames(
            (now - buildStarted) / 1000,
            time,
            now,
            updateSketch,
          );
          if (updateSketch) lastPhotoSketchUpdate = now;
          updateSky(time);
          water.material.uniforms.uCameraPosition.value.copy(camera.position);
          water.material.uniforms.uMoonDirection.value.copy(moonSkyDirection);
          updateMoon(time);
          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(tick);
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            if (animationFrameId !== null)
              cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            return;
          }
          last = performance.now();
          if (touched && !reduce && !controls.autoRotate) {
            resumeAutoRotateAfterIdle();
          }
          if (animationFrameId === null)
            animationFrameId = requestAnimationFrame(tick);
        });
        build("pink", true);
        onResize();
        if (!document.hidden) animationFrameId = requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
